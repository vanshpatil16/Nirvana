<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Nirvana platform architecture: browser routes into a Vercel edge server and a Render integration gateway, which fan out to data, AI and standards providers.">
  <title>Nirvana — platform architecture</title>
  <desc>Animated architecture: users reach the Vercel-hosted React frontend and the Render-hosted Land Stack API, which federate map data, satellite data, AI services and open geospatial standards.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a14"/>
      <stop offset="100%" stop-color="#101a15"/>
    </linearGradient>
    <linearGradient id="flowA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9F6E" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#0D9F6E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D9F6E" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="flowB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7B84B" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#E7B84B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E7B84B" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="flowC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5BA9C4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#5BA9C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5BA9C4" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .card   { fill:#132019; stroke:#2a4a38; stroke-width:1.5; rx:12; }
      .accent { stroke:#0D9F6E; stroke-width:2; }
      .gold   { stroke:#E7B84B; stroke-width:2; }
      .t      { font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; }
      .ttl    { font-size:17px; font-weight:800; fill:#F8F7F1; letter-spacing:.4px; }
      .sub    { font-size:11.5px; fill:#9dbdae; }
      .lbl    { font-size:10.5px; fill:#bcd6c8; }
      .lane   { font-size:10px; fill:#6f8a7c; letter-spacing:1.4px; font-weight:700; }
      .pkt    { animation: travel 3.4s linear infinite; }
      .pkt.b  { animation-delay: -1.1s; }
      .pkt.c  { animation-delay: -2.2s; }
      .pulse  { animation: pulse 3s ease-in-out infinite; transform-origin:center; }
      .pulse2 { animation: pulse 3s ease-in-out infinite; transform-origin:center; animation-delay:-1.5s; }
      .scan   { animation: sweep 5s linear infinite; }
      .blink  { animation: blink 1.8s steps(2,start) infinite; }
      @keyframes travel { 0%{offset-distance:0%;opacity:0} 12%{opacity:1} 88%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes pulse  { 0%,100%{opacity:.35; r:5} 50%{opacity:1; r:7} }
      @keyframes sweep  { 0%{transform:translateX(0)} 100%{transform:translateX(940px)} }
      @keyframes blink  { 0%,100%{opacity:1} 50%{opacity:.25} }
      @media (prefers-reduced-motion: reduce) {
        .pkt,.pkt.b,.pkt.c,.pulse,.pulse2,.scan,.blink { animation: none; }
      }
    </style>
  </defs>

  <rect width="1000" height="520" fill="url(#sky)" rx="16"/>

  <!-- ambient breathing rings -->
  <g opacity=".5">
    <circle class="pulse"  cx="500" cy="250" r="5" fill="#0D9F6E" filter="url(#glow)"/>
    <circle class="pulse2" cx="500" cy="250" r="5" fill="#E7B84B" filter="url(#glow)"/>
  </g>

  <!-- lane labels -->
  <text class="t lane" x="26" y="42">USERS</text>
  <text class="t lane" x="26" y="150">EXPERIENCE · VERCEL</text>
  <text class="t lane" x="26" y="308">INTEGRATION · RENDER</text>
  <text class="t lane" x="26" y="452">SOURCES · STANDARDS</text>

  <!-- users -->
  <g class="t">
    <rect class="card" x="22" y="56" width="132" height="62"/>
    <text class="ttl" x="38" y="82">Nirvana</text>
    <text class="sub" x="38" y="100">निर्वाण · web app</text>
  </g>

  <!-- frontend -->
  <g class="t">
    <rect class="card accent" x="182" y="118" width="336" height="112"/>
    <text class="ttl" x="200" y="145">Frontend</text>
    <text class="sub" x="200" y="164">React 19 · TanStack Start · nitro edge</text>
    <rect class="card" x="200" y="176" width="94" height="34" fill="#0f2a1e"/>
    <text class="lbl" x="212" y="197">MapLibre</text>
    <rect class="card" x="302" y="176" width="94" height="34" fill="#0f2a1e"/>
    <text class="lbl" x="314" y="197">Cesium 3D</text>
    <rect class="card" x="404" y="176" width="94" height="34" fill="#0f2a1e"/>
    <text class="lbl" x="416" y="197">Innovation</text>
  </g>

  <!-- backend -->
  <g class="t">
    <rect class="card gold" x="182" y="276" width="336" height="112"/>
    <text class="ttl" x="200" y="303">Land Stack API</text>
    <text class="sub" x="200" y="322">FastAPI · roles · provenance · RFC 7807</text>
    <rect class="card" x="200" y="334" width="94" height="34" fill="#2a2410"/>
    <text class="lbl" x="212" y="355">OGC Feat.</text>
    <rect class="card" x="302" y="334" width="94" height="34" fill="#2a2410"/>
    <text class="lbl" x="314" y="355">STAC 1.0</text>
    <rect class="card" x="404" y="334" width="94" height="34" fill="#2a2410"/>
    <text class="lbl" x="416" y="355">Adapters</text>
  </g>

  <!-- data sources -->
  <g class="t">
    <rect class="card" x="182" y="420" width="336" height="74"/>
    <text class="ttl" x="200" y="446">Evidence layer</text>
    <text class="sub" x="200" y="466">Every payload carries source · licence · evidence grade</text>
    <text class="lbl" x="200" y="483">OSM · ISRO Bhuvan · data.gov.in · IMD · MRSAC · Sentinel-2 · RBIH</text>
  </g>

  <!-- right column: standards + AI -->
  <g class="t">
    <rect class="card" x="556" y="56" width="196" height="62"/>
    <text class="ttl" x="572" y="82">Standards</text>
    <text class="sub" x="572" y="100">OGC API · STAC · GeoJSON</text>

    <rect class="card" x="556" y="140" width="196" height="62"/>
    <text class="ttl" x="572" y="166">AI services</text>
    <text class="sub" x="572" y="184">OpenRouter · Gemini · TTS</text>

    <rect class="card" x="556" y="224" width="196" height="62"/>
    <text class="ttl" x="572" y="250">Provenance</text>
    <text class="sub" x="572" y="268">observed → derived → modelled</text>

    <rect class="card" x="556" y="308" width="196" height="62"/>
    <text class="ttl" x="572" y="334">Privacy</text>
    <text class="sub" x="572" y="352">5 roles · DPDP-aware</text>

    <rect class="card" x="556" y="392" width="196" height="62"/>
    <text class="ttl" x="572" y="418">Quality gates</text>
    <text class="sub" x="572" y="436">tsc · eslint · build · E2E</text>
  </g>

  <!-- flow: users -> frontend -->
  <path d="M154 87 C 168 87, 168 150, 182 150" fill="none" stroke="url(#flowA)" stroke-width="2.5"/>
  <circle class="pkt" r="3.5" fill="#0D9F6E">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M154 87 C 168 87, 168 150, 182 150"/>
  </circle>

  <!-- flow: users -> gateway -->
  <path d="M154 100 C 168 100, 168 320, 182 320" fill="none" stroke="url(#flowB)" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle class="pkt b" r="3.5" fill="#E7B84B">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M154 100 C 168 100, 168 320, 182 320"/>
  </circle>

  <!-- flow: frontend -> evidence -->
  <path d="M350 230 C 350 300, 300 380, 300 420" fill="none" stroke="url(#flowA)" stroke-width="2.5"/>
  <circle class="pkt" r="3.5" fill="#0D9F6E">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M350 230 C 350 300, 300 380, 300 420"/>
  </circle>

  <!-- flow: gateway -> evidence -->
  <path d="M420 388 C 420 404, 380 410, 380 420" fill="none" stroke="url(#flowB)" stroke-width="2.5"/>
  <circle class="pkt b" r="3.5" fill="#E7B84B">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M420 388 C 420 404, 380 410, 380 420"/>
  </circle>

  <!-- flows to right column -->
  <path d="M518 160 C 536 160, 536 87, 556 87" fill="none" stroke="url(#flowC)" stroke-width="2"/>
  <circle class="pkt c" r="3" fill="#5BA9C4">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M518 160 C 536 160, 536 87, 556 87"/>
  </circle>

  <path d="M518 350 C 540 350, 540 255, 556 255" fill="none" stroke="url(#flowB)" stroke-width="2"/>
  <circle class="pkt b" r="3" fill="#E7B84B">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M518 350 C 540 350, 540 255, 556 255"/>
  </circle>

  <path d="M518 457 C 538 457, 538 423, 556 423" fill="none" stroke="url(#flowA)" stroke-width="2"/>
  <circle class="pkt" r="3" fill="#0D9F6E">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M518 457 C 538 457, 538 423, 556 423"/>
  </circle>

  <!-- scanning highlight -->
  <rect class="scan" x="22" y="52" width="3" height="444" fill="#E7B84B" opacity=".35"/>

  <!-- footer legend -->
  <g class="t">
    <circle cx="800" cy="70" r="5" fill="#0D9F6E"/><text class="lbl" x="812" y="74">frontend → Vercel</text>
    <circle cx="800" cy="94" r="5" fill="#E7B84B"/><text class="lbl" x="812" y="98">gateway → Render</text>
    <circle cx="800" cy="118" r="5" fill="#5BA9C4"/><text class="lbl" x="812" y="122">standards / AI</text>
    <text class="lbl" x="800" y="450">nirvana · भूमि governance research</text>
  </g>
</svg>
