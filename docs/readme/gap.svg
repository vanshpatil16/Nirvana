<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="Of 2,446 plots with a 7/12 record: 1,036 within 10 percent, 853 off by 10 to 30 percent, 557 off by 30 percent or more">
<style>
  .row{opacity:0;animation:in .7s ease forwards}
  .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.3s cubic-bezier(.2,.8,.2,1) forwards}
  .pct{opacity:0;animation:in .5s ease forwards}
  @keyframes in{to{opacity:1}}
  @keyframes grow{to{transform:scaleX(1)}}
</style>
<rect width="1280" height="250" rx="22" fill="#03110a"/>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="40" y="38" fill="#bfe9cf" font-size="12.5" font-weight="700" letter-spacing="2.5">THE GAP · REAL DATA · VADNERBHAIRAV, NASHIK</text>
  <text x="1240" y="38" fill="#ffffff" fill-opacity=".45" font-size="12.5" text-anchor="end">|drawn area − (7/12 area + pot-kharaba)| ÷ drawn area</text>
  
  <g class="row" style="animation-delay:0.20s">
    <text x="40" y="90" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="40">1,036</text>
    <text x="170" y="76" fill="#ffffff" font-size="15" font-weight="600">within 10 %</text>
    <text x="170" y="96" fill="#ffffff" fill-opacity=".55" font-size="13">drawn plot and 7/12 agree</text>
    <rect x="420" y="68" width="560" height="24" rx="12" fill="#ffffff" fill-opacity=".06"/>
    <rect class="bar" x="420" y="68" width="560" height="24" rx="12" fill="#39c47a" style="animation-delay:0.35s"/>
    <text x="990" y="85" fill="#ffffff" fill-opacity=".8" font-size="12.5" font-weight="700" class="pct" style="animation-delay:1.20s">42%</text>
  </g>
  <g class="row" style="animation-delay:0.38s">
    <text x="40" y="148" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="40">853</text>
    <text x="170" y="134" fill="#ffffff" font-size="15" font-weight="600">off by 10–30 %</text>
    <text x="170" y="154" fill="#ffffff" fill-opacity=".55" font-size="13">worth a second look</text>
    <rect x="420" y="126" width="560" height="24" rx="12" fill="#ffffff" fill-opacity=".06"/>
    <rect class="bar" x="420" y="126" width="461" height="24" rx="12" fill="#e3a832" style="animation-delay:0.53s"/>
    <text x="891" y="143" fill="#ffffff" fill-opacity=".8" font-size="12.5" font-weight="700" class="pct" style="animation-delay:1.38s">35%</text>
  </g>
  <g class="row" style="animation-delay:0.56s">
    <text x="40" y="206" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="40">557</text>
    <text x="170" y="192" fill="#ffffff" font-size="15" font-weight="600">off by 30 % or more</text>
    <text x="170" y="212" fill="#ffffff" fill-opacity=".55" font-size="13">send someone to the field</text>
    <rect x="420" y="184" width="560" height="24" rx="12" fill="#ffffff" fill-opacity=".06"/>
    <rect class="bar" x="420" y="184" width="301" height="24" rx="12" fill="#e0553d" style="animation-delay:0.71s"/>
    <text x="731" y="201" fill="#ffffff" fill-opacity=".8" font-size="12.5" font-weight="700" class="pct" style="animation-delay:1.56s">23%</text>
  </g>
</g>
</svg>